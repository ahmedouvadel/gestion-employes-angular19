<app-header></app-header>

<!-- 📦 Carte de recherche + ajout -->
<div class="card mt-4">
  <div class="card-header">Rechercher un employé</div>
  <div class="card-body d-flex flex-wrap gap-3 align-items-center">
    <form class="form-group flex-grow-1" [formGroup]="searchForm">
      <input
        type="text"
        class="form-control"
        (input)="filterEmployees()"
        formControlName="keyword"
        placeholder="Nom ou prénom de l'employé"
      />
    </form>

    <button class="btn btn-primary" (click)="openAddEmployee()">Nouvel departement</button>
  </div>
</div>

<div class="container mt-4">
  <div class="card">
    <div class="card-header">Liste des départements</div>
    <div class="card-body">
      <table class="table table-hover table-bordered">
        <thead class="thead-dark">
          <tr>
            <th>#ID</th>
            <th>Nom</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dep of departments">
            <td>{{ dep.id }}</td>
            <td>{{ dep.name }}</td>
            <td>
              <a class="text-primary me-3" (click)="editDepartment(dep.id)">
                <mat-icon>edit</mat-icon>
              </a>
              <a class="text-danger" (click)="confirmDelete(dep.id)">
                <mat-icon>delete</mat-icon>
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="departments.length === 0" class="alert alert-secondary">
        Aucun département trouvé.
      </div>
    </div>
  </div>

  <!-- 🔴 Modal de confirmation -->
  <div *ngIf="showConfirmDialog" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <p>Voulez-vous vraiment <strong class="text-danger">supprimer</strong> ce département ?</p>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-outline-secondary" (click)="cancelDelete()">Annuler</button>
          <button class="btn btn-danger" (click)="deleteDepartment()">Confirmer</button>
        </div>
      </div>
    </div>
  </div>
</div>
