<app-header></app-header>

<!-- 📦 Carte de recherche + ajout -->
<div class="card mt-4">
  <div class="card-header">Rechercher un employé</div>
  <div class="card-body d-flex flex-wrap gap-3 align-items-center">
    <form class="form-group flex-grow-1" [formGroup]="searchForm">
      <input
        type="text"
        class="form-control"
        (input)="filterEmployees()"
        formControlName="keyword"
        placeholder="Nom ou prénom de l'employé"
      />
    </form>

    <button type="button" class="btn btn-primary" (click)="openAddEmployee()">Ajout d'employé</button>
  </div>
</div>

<!-- 📄 Liste des employés -->
<div class="card mt-3">
  <div class="card-header">Liste des employés</div>
  <div class="card-body">
    <table class="table table-hover table-bordered">
      <thead class="thead-dark">
        <tr>
          <th scope="col">#ID</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Département</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of filteredEmployees">
          <td>{{ emp.id }}</td>
          <td>{{ emp.first_name }}</td>
          <td>{{ emp.last_name }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.department_id }}</td>
          <td>
            <a class="me-2 text-primary" (click)="editEmployee(emp.id)">
              <mat-icon>edit</mat-icon>
            </a>
            <a class="text-danger" (click)="triggerDeleteEmployee(emp.id)">
              <mat-icon>delete</mat-icon>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 💬 Alerte s'il n'y a pas de résultat -->
<div *ngIf="filteredEmployees.length === 0" class="alert alert-secondary mt-3">
  Aucun employé trouvé pour le moment.
</div>

<!-- 🔴 Modal de confirmation suppression employé -->
<div *ngIf="showConfirmEmployeeDialog" class="modal-backdrop">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h5 class="modal-title mb-2">Confirmation</h5>
      <p>
        Voulez-vous vraiment <strong class="text-danger">supprimer</strong> cet employé ?
      </p>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button class="btn btn-outline-secondary" (click)="cancelDeleteEmployee()">Annuler</button>
        <button class="btn btn-danger" (click)="confirmDeleteEmployee()">Confirmer</button>
      </div>
    </div>
  </div>
</div>
