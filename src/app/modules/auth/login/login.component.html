<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Connexion</h3>

          <form [formGroup]="formGroup" (ngSubmit)="login()">
            <div class="mb-3">
              <label for="email" class="form-label">Adresse Email</label>
              <input type="email" class="form-control" id="email" formControlName="email" placeholder="exemple@email.com" />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="password" formControlName="password" placeholder="••••••••" />
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary" (click)="login()">Se connecter</button>
            </div>
          </form>

          <p class="text-center mt-3">
            Pas encore de compte ?
            <a (click)="goToRegister()">Créer un compte</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
